[project]
name = "empower-mcp"
version = "0.1.0"
description = "Local, read-only MCP server for Empower Personal Dashboard (formerly Personal Capital)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
empower-mcp = "empower_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empower_mcp"]
